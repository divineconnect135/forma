# Forma — Render API deployment
# Repository: npm workspaces monorepo

services:
  - type: web
    name: forma-api

    runtime: node
    plan: free

    # Install build-time TypeScript dependencies,
    # even when NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build -w @forma/api

    # Start the compiled Express application.
    startCommand: npm run start -w @forma/api

    healthCheckPath: /api/health
    autoDeployTrigger: off

    envVars:
      - key: NODE_ENV
        value: production

      - key: TRUST_PROXY
        value: "1"

      - key: MONGODB_URI
        sync: false

      - key: SESSION_SECRET
        generateValue: true

      - key: STRIPE_SECRET_KEY
        sync: false

      - key: STRIPE_WEBHOOK_SECRET
        sync: false
