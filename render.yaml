# ============================================
# FORMA — RENDER BACKEND DEPLOYMENT
# ============================================

services:
  - type: web
    name: forma-api

    runtime: node
    plan: free

    # Keep the repository root as the working
    # directory because Forma uses npm workspaces.

    # Install dependencies from the root lockfile
    # and compile only the Express API.
    buildCommand: npm ci && npm run build -w @forma/api

    # Run the existing compiled API start script.
    startCommand: npm run start -w @forma/api

    # Check real MongoDB connectivity.
    healthCheckPath: /api/health

    # Deploy manually until verification passes.
    autoDeployTrigger: "off"

    envVars:
      # Production Node environment.
      - key: NODE_ENV
        value: production

      # Render runs behind a reverse proxy.
      - key: TRUST_PROXY
        value: "1"

      # MongoDB Atlas connection string.
      - key: MONGODB_URI
        sync: false

      # Generate a secure session secret.
      - key: SESSION_SECRET
        generateValue: true

      # Stripe test-mode secret key.
      - key: STRIPE_SECRET_KEY
        sync: false

      # Secret from the deployed Stripe
      # test-mode webhook destination.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
